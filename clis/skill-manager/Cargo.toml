[package]
name = "skill-manager"
version = "0.1.4"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"
description = "Manage reusable agent skills across AI development tools"
repository = "https://github.com/sernst/skills"

[lib]
name = "skill_manager"
path = "src/lib.rs"

[[bin]]
name = "skill-manager"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env", "string"] }
clap_complete = "4.6.11"
clap_mangen = { version = "0.3.3", features = ["env"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
home = "0.5.12"
flate2 = "1.1.10"
fs2 = "0.4.3"
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.26"
unicode-width = "0.2.2"
url = "2.5.8"
walkdir = "2.5.0"
webpki-roots = "1.0.11"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
too_many_arguments = "allow"
