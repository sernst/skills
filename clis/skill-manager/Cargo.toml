[package]
name = "skill-manager"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "Apache-2.0"
description = "Manage reusable agent skills across AI development tools"
repository = "https://github.com/sernst/skills"

[lib]
name = "skill_manager"
path = "src/lib.rs"

[[bin]]
name = "skill-manager"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.48", features = ["derive", "env", "string"] }
clap_complete = "4.5.58"
clap_mangen = "0.2.28"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
home = "0.5.12"
flate2 = "1.1.2"
fs2 = "0.4.3"
hex = "0.4.3"
indexmap = { version = "2.11.4", features = ["serde"] }
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["preserve_order"] }
sha2 = "0.10.9"
tar = "0.4.44"
tempfile = "3.23.0"
thiserror = "2.0.17"
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.24"
unicode-width = "0.2.0"
url = "2.5.7"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
too_many_arguments = "allow"
