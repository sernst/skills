[graph]
all-features = true

[advisories]
version = 2
ignore = [
    # chrono is flagged unmaintained, not vulnerable, and has no safe upgrade.
    # Replace it with a maintained date-time crate, then remove this entry.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; replace per issue #88 (2026-11-18)" },
]

[licenses]
version = 2
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
