name: Pull request quality

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Run repository quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and quality tools
        shell: pwsh
        run: pwsh -File tools/install-ci-tools.ps1 -Mode Quality
      - name: Validate registry contract
        shell: pwsh
        run: pwsh -File tools/get-build-matrix.ps1 -ValidateOnly
      - name: Full Linux GNU quality gate
        run: just check
      - name: Audit GitHub workflows
        run: zizmor --pedantic .github/workflows
