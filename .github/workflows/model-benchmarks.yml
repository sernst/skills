name: Refresh model benchmarks

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: model-benchmark-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Validate and propose benchmark snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - id: app-token
        name: Create narrowly scoped updater token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.BENCHMARK_APP_ID }}
          private-key: ${{ secrets.BENCHMARK_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Fetch, validate, and render all allowlisted sources
        run: python -m tools.model_benchmarks refresh

      - id: diff
        name: Enforce generated-file diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          allowed='skills/running-as-maestro/references/benchmark-snapshot.md'
          mapfile -t files < <(git status --porcelain=v1 | cut -c4-)
          if (( ${#files[@]} == 0 )); then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Snapshot is current; no branch or pull request will be created.'
            exit 0
          fi
          if (( ${#files[@]} != 1 )) || [[ "${files[0]}" != "$allowed" ]]; then
            echo "Refresh changed files outside the allowlist: ${files[*]}" >&2
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          body_path="$RUNNER_TEMP/benchmark-pr-body.md"
          {
            echo 'Automated refresh of the allowlisted model benchmark snapshot.'
            echo
            echo 'Only the generated snapshot is changed. Normal pull-request checks, bot approval, and squash auto-merge apply.'
            echo
            echo '## Source versions and timestamps'
            echo
            echo '**Before**'
            git show "HEAD:$allowed" | grep '^Source:' || true
            echo
            echo '**After**'
            grep '^Source:' "$allowed" || true
          } > "$body_path"
          echo "body_path=$body_path" >> "$GITHUB_OUTPUT"

      - id: pr
        if: steps.diff.outputs.changed == 'true'
        name: Create or update the single benchmark PR
        shell: bash
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BODY_PATH: ${{ steps.diff.outputs.body_path }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          branch='automation/model-benchmark-snapshot'
          snapshot='skills/running-as-maestro/references/benchmark-snapshot.md'
          git config user.name 'benchmark-updater[bot]'
          git config user.email 'benchmark-updater[bot]@users.noreply.github.com'
          git switch --force-create "$branch"
          git add -- "$snapshot"
          git commit -m 'chore: refresh maestro model benchmarks'
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          remote=$(git ls-remote --heads origin "refs/heads/$branch")
          if [[ -n "$remote" ]]; then
            expected=${remote%%$'\t'*}
            git push "--force-with-lease=refs/heads/$branch:$expected" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          number=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" \
              -f title='chore: refresh maestro model benchmarks' \
              -F "body=@$BODY_PATH" >/dev/null
          else
            url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title 'chore: refresh maestro model benchmarks' --body-file "$BODY_PATH")
            number=${url##*/}
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - if: steps.diff.outputs.changed == 'true'
        name: Approve as GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr review "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --approve --body 'Validated generated-file-only benchmark refresh.'

      - if: steps.diff.outputs.changed == 'true'
        name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch

      - if: failure()
        name: Open or update the deduplicated failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m tools.model_benchmarks issue failure --repository "$GITHUB_REPOSITORY" --run-url "$RUN_URL"

      - if: success()
        name: Record recovery and close any open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python -m tools.model_benchmarks issue recovery
          --repository "$GITHUB_REPOSITORY"
          --run-url "$RUN_URL"
          --pull-request "$PR_NUMBER"
          --snapshot skills/running-as-maestro/references/benchmark-snapshot.md
