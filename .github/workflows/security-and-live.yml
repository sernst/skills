name: Weekly advisory and live smoke

on:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  advisory:
    name: Check dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: pwsh -File tools/install-ci-tools.ps1 -Mode Advisory
      - run: just advisory
  live-github-smoke:
    name: Exercise live GitHub source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build current CLI
        shell: pwsh
        run: |
          pwsh -File tools/install-ci-tools.ps1 -Mode Advisory
          pwsh -File tools/get-build-matrix.ps1 -ValidateOnly
          just release-build
      - name: Exercise GitHub source at an exact commit
        run: |
          sudo useradd --create-home --shell /bin/bash skill-manager-smoke
          sudo --user skill-manager-smoke --set-home just live-smoke "https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/skills"
