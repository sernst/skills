name: Weekly advisory and live smoke

on:
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  advisory:
    name: Check dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - shell: pwsh
        run: pwsh -File tools/install-ci-tools.ps1 -Mode Advisory
      - run: just advisory
  live-github-smoke:
    name: Exercise live GitHub source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and advisory tools
        shell: pwsh
        run: pwsh -File tools/install-ci-tools.ps1 -Mode Advisory
      - name: Build current CLI
        shell: pwsh
        run: |
          pwsh -File tools/get-build-matrix.ps1 -ValidateOnly
          just release-build
      - name: Exercise GitHub source at an exact commit
        run: |
          set -euo pipefail
          smoke_source_url="https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_SHA}/skills"
          sudo useradd --no-create-home --shell /bin/bash skill-manager-smoke
          trap 'sudo userdel skill-manager-smoke' EXIT
          sudo --user skill-manager-smoke --set-home /bin/bash \
            "${GITHUB_WORKSPACE}/tools/live-github-smoke.sh" \
            "${GITHUB_WORKSPACE}/clis/skill-manager/target/release/skill-manager" \
            "$smoke_source_url"
