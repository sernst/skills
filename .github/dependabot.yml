version: 2
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: daily
updates:
  - package-ecosystem: cargo
    directory: /clis/skill-manager
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: all-dependencies
